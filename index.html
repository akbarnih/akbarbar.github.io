<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Akbar Nubijak — Beranda</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eeeeee;
            color: #222;
        }

        .container {
            width: 850px;
            max-width: 92%;
            margin: 40px auto;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        /* HEADER */
        header {
            background: #167c80;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            margin-top: 10px;
            opacity: 0.9;
        }

        /* NAVBAR */
        nav {
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin: 0 12px;
        }

        nav a:hover {
            color: #167c80;
        }

        /* CONTENT */
        .content {
            display: flex;
        }

        .main {
            width: 70%;
            padding: 30px;
        }

        .sidebar {
            width: 30%;
            padding: 25px;
            background: #f5f5f5;
        }

        /* ARTIKEL */
        .article {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .article:last-child {
            border-bottom: none;
        }

        .article h2 {
            margin: 0 0 5px;
            color: #167c80;
        }

        .date {
            color: #888;
            font-size: 12px;
            text-align: right;
            margin-bottom: 15px;
        }

        .article p {
            line-height: 1.7;
        }

        .read-more {
            color: #167c80;
            text-decoration: none;
            font-weight: bold;
        }

        .read-more:hover {
            text-decoration: underline;
        }

        /* SIDEBAR */
        .sidebar h3 {
            color: #167c80;
            margin-top: 0;
        }

        .sidebar a {
            color: #333;
            text-decoration: none;
        }

        .sidebar li {
            margin-bottom: 12px;
        }
